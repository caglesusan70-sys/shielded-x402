[package]
name = "x402-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full", "signal"] }
tonic = "0.10"
prost = "0.12"
rusqlite = { version = "0.30", features = ["bundled"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
