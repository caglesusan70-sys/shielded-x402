[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shielded-x402"
version = "0.1.0"
description = "Client SDK for Privacy-Preserving HTTP 402 Zcash Settlement"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.24.0", "cryptography>=41.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
